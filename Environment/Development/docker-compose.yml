services:
  postgres:
    build:
      context: ../../backend/database
    image: ph-postgres:18.1-alpine
    container_name: ph-postgres-dev
    restart: unless-stopped
    env_file: ./dev.env
    ports:
      - "5432:5432"
    volumes:
      - ../../backend/database/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    build:
      context: ../../backend/n8n
    image: ph-n8n:2.4.7
    container_name: ph-n8n-dev
    restart: unless-stopped
    env_file: ./dev.env
    ports:
      - "5678:5678"
    volumes:
      - ../../backend/n8n/data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  django:
    build:
      context: ../../backend/django
    image: ph-django:0.1
    container_name: ph-django-dev
    restart: unless-stopped
    env_file: ./dev.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ../../backend/django:/app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
